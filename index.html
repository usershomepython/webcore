<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>webcore // breakcore face tracking</title>
  
  <style>
    /* =============================================================
       1. СТИЛИ ИНТЕРФЕЙСА (WEBCORE / GLITCHCORE DARK THEME)
       ============================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #05010a;
      color: #e879f9;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100vw;
      height: 100vh;
      justify-content: center;
    }

    /* Холст с эффектом свечения */
    #glitch_canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(115%) brightness(95%);
    }

    /* Верхний HUD-статус в стиле терминала / аналогового ТВ */
    #hud {
      position: absolute;
      top: 16px;
      left: 20px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f43f5e;
      background: rgba(10, 0, 20, 0.7);
      padding: 6px 12px;
      border-left: 3px solid #d946ef;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 8px #f43f5e;
    }

    /* Невидимый тег видео (источник кадров для MediaPipe) */
    #raw_video {
      display: none;
    }
  </style>

  <!-- =============================================================
       2. CDN БИБЛИОТЕКИ MEDIAPIPE FACE MESH
       ============================================================= -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="wrapper">
    <div id="hud">SYS.INIT // SEARCHING_INPUT...</div>
    <video id="raw_video" playsinline></video>
    <canvas id="glitch_canvas"></canvas>
  </div>

  <script>
    /* =============================================================
       3. ИНИЦИАЛИЗАЦИЯ И НАСТРОЙКА ПЕРЕМЕННЫХ
       ============================================================= */
    const video = document.getElementById('raw_video');
    const canvas = document.getElementById('glitch_canvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');

    let isProcessing = false;
    let frameCount = 0;

    // Палитра в стиле видео (пурпурный, фиолетовый, неоновый белый)
    const GLITCH_COLORS = [
      'rgba(168, 85, 247, 0.85)', // Яркий фиолетовый
      'rgba(217, 70, 239, 0.9)',  // Пурпурный (Magenta)
      'rgba(112, 26, 117, 0.75)', // Темно-пурпурный (артефакт сжатия)
      'rgba(255, 255, 255, 0.95)' // Белый шум
    ];

    /* =============================================================
       4. ПОДКЛЮЧЕНИЕ ОСНОВНОЙ (ЗАДНЕЙ) КАМЕРЫ ЧЕРЕЗ WEBRTC
       ============================================================= */
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            // Запрашиваем именно заднюю/основную камеру
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        // Синхронизируем физический размер холста с разрешением видео
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;

        hud.innerText = "CAMERA: ENVIRONMENT // TRACKING ACTIVE";
        hud.style.color = "#a855f7";

        // Запуск цикла обработки кадров
        startProcessingLoop();
      } catch (err) {
        console.error("Ошибка камеры:", err);
        hud.innerText = "CAMERA_ERR: ACCESS DENIED OR MISSING";
        hud.style.color = "#ef4444";
      }
    }

    /* =============================================================
       5. КОНФИГУРАЦИЯ MEDIAPIPE FACE MESH
       ============================================================= */
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 2,              // Отслеживаем до двух лиц в кадре
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    // Цикл непрерывной передачи кадров в нейросеть
    function startProcessingLoop() {
      async function step() {
        if (video.readyState >= 2 && !isProcessing) {
          isProcessing = true;
          await faceMesh.send({ image: video });
          isProcessing = false;
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    /* =============================================================
       6. ПРОЦЕДУРНЫЕ GLITCHCORE / BREAKCORE ЭФФЕКТЫ
       ============================================================= */

    /**
     * Эффект смещения полос и артефактов датамошинга (Datamosh slice)
     */
    function applyDatamoshSlices(ctx, width, height) {
      if (Math.random() < 0.45) {
        const sliceHeight = Math.floor(Math.random() * 40) + 10;
        const sliceY = Math.floor(Math.random() * (height - sliceHeight));
        const offset = (Math.random() - 0.5) * 45;

        // Копируем полосу и сдвигаем её по горизонтали
        ctx.drawImage(canvas, 0, sliceY, width, sliceHeight, offset, sliceY, width, sliceHeight);

        // Иногда заливаем сдвинутую полосу фиолетовым оверлеем
        if (Math.random() < 0.5) {
          ctx.fillStyle = 'rgba(192, 38, 211, 0.25)';
          ctx.fillRect(0, sliceY, width, sliceHeight);
        }
      }
    }

    /**
     * Отрисовка фиолетовых битых блоков (артефактов сжатия) вокруг точек лица
     */
    function drawGlitchBoxes(ctx, landmarks, w, h) {
      // Ключевые области: глаза (33, 263), рот (13), нос (1), лоб (10)
      const targetIndices = [33, 263, 13, 1, 10, 234, 454];

      targetIndices.forEach((idx) => {
        if (Math.random() < 0.75) {
          const pt = landmarks[idx];
          const px = pt.x * w;
          const py = pt.y * h;

          // Случайные размеры цифрового блока
          const boxW = Math.floor(Math.random() * 90) + 30;
          const boxH = Math.floor(Math.random() * 60) + 20;
          const jitterX = (Math.random() - 0.5) * 30;
          const jitterY = (Math.random() - 0.5) * 30;

          // Заливка фиолетовым/пурпурным блоком
          ctx.fillStyle = GLITCH_COLORS[Math.floor(Math.random() * GLITCH_COLORS.length)];
          ctx.fillRect(px - boxW / 2 + jitterX, py - boxH / 2 + jitterY, boxW, boxH);

          // Контурная белая обводка (стилистика сжатия в видео)
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = Math.random() < 0.5 ? 1 : 2;
          ctx.strokeRect(px - boxW / 2 + jitterX, py - boxH / 2 + jitterY, boxW, boxH);
        }
      });
    }

    /**
     * Отрисовка полигональной сетки лица в стиле кибер-контуров
     */
    function drawMeshContours(ctx, landmarks, w, h) {
      // Контур овала лица и глаз
      const ovalPoints = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];

      ctx.beginPath();
      ovalPoints.forEach((id, i) => {
        const x = landmarks[id].x * w + (Math.random() - 0.5) * 3;
        const y = landmarks[id].y * h + (Math.random() - 0.5) * 3;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();

      ctx.strokeStyle = Math.random() < 0.3 ? '#ffffff' : '#d946ef';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    /**
     * Отрисовка горизонтальных кинескопных линий (Scanlines)
     */
    function drawScanlines(ctx, w, h) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
      for (let y = 0; y < h; y += 4) {
        ctx.fillRect(0, y, w, 1.5);
      }
    }

    /* =============================================================
       7. ГЛАВНЫЙ ОБРАБОТЧИК КАДРА
       ============================================================= */
    function onResults(results) {
      frameCount++;
      const w = canvas.width;
      const h = canvas.height;

      // 1. Рисуем прямой видеопоток (без зеркалирования для задней камеры)
      ctx.drawImage(results.image, 0, 0, w, h);

      // 2. Если лицо обнаружено — генерируем glitchcore-наложение
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        for (const landmarks of results.multiFaceLandmarks) {
          drawMeshContours(ctx, landmarks, w, h);
          drawGlitchBoxes(ctx, landmarks, w, h);
        }
      }

      // 3. Добавляем горизонтальные артефакты датамошинга
      applyDatamoshSlices(ctx, w, h);

      // 4. Накладываем аналоговые сканлайны
      drawScanlines(ctx, w, h);

      // 5. Текстовый HUD-индикатор времени кадра
      if (frameCount % 6 === 0) {
        hud.innerText = `SYS.EXEC // NOISE_MOD [${(Math.random() * 9999).toFixed(0)}] // FACE_SYNC`;
      }
    }

    // Старт работы
    window.addEventListener('DOMContentLoaded', initCamera);
  </script>
</body>
</html>
