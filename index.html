<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WEBCORE // ANY OBJECT TRACKING</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: monospace;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      filter: contrast(135%) saturate(160%);
    }

    #hud {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 13px;
      font-weight: bold;
      color: #ff0055;
      background: rgba(10, 0, 20, 0.85);
      padding: 8px 14px;
      border-left: 4px solid #d946ef;
      z-index: 100;
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #video {
      display: none;
    }
  </style>

  <!-- Подключение TensorFlow.js и детектора любых объектов COCO-SSD -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>

<body>
  <div id="hud">SYSTEM BOOT // CAMERA INIT...</div>
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');

    // Вспомогательный маленький холст для быстрого оптического анализа контуров (60 FPS)
    const scanCanvas = document.createElement('canvas');
    const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
    scanCanvas.width = 120;
    scanCanvas.height = 68;

    let objectModel = null;
    let aiDetections = [];
    let isDetecting = false;
    let prevFrameData = null;

    /* -------------------------------------------------------------
       1. ПОДКЛЮЧЕНИЕ ОСНОВНОЙ КАМЕРЫ
       ------------------------------------------------------------- */
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }, // Задняя камера
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        
        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });

        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;

        hud.innerText = "CAMERA ACTIVE // LOADING OBJECT AI...";
        
        // Запуск AI-модели детекции объектов
        loadAIModel();

        // Запуск визуального рендера
        requestAnimationFrame(renderLoop);
      } catch (err) {
        hud.innerText = `CAMERA_ERR: ${err.message}`;
        hud.style.color = "red";
      }
    }

    /* -------------------------------------------------------------
       2. ЗАГРУЗКА AI-МОДЕЛИ ДЛЯ ЛЮБЫХ ОБЪЕКТОВ (COCO-SSD)
       ------------------------------------------------------------- */
    async function loadAIModel() {
      try {
        objectModel = await cocoSsd.load();
        hud.innerText = "SYSTEM ACTIVE // TRACKING ANY OBJECTS";
        hud.style.color = "#00ff66";
        startAIDetectionLoop();
      } catch (e) {
        console.warn("AI Model load warning, using optical tracking:", e);
        hud.innerText = "CV OPTICAL TRACKING ACTIVE";
        hud.style.color = "#d946ef";
      }
    }

    async function startAIDetectionLoop() {
      if (objectModel && video.readyState >= 2 && !isDetecting) {
        isDetecting = true;
        try {
          const predictions = await objectModel.detect(video);
          // Фильтруем распознанные объекты с уверенностью от 40%
          aiDetections = predictions.filter(p => p.score > 0.4);
        } catch (err) {
          console.error(err);
        } finally {
          isDetecting = false;
        }
      }
      setTimeout(startAIDetectionLoop, 80); // ~12 проверок в секунду
    }

    /* -------------------------------------------------------------
       3. ОПТИЧЕСКИЙ ТРЕКИНГ КОНТУРОВ И ДВИЖЕНИЯ (ДЛЯ ДЕРЕВЬЕВ И ПРИРОДЫ)
       ------------------------------------------------------------- */
    function detectOpticalObjects(w, h) {
      const sw = scanCanvas.width;
      const sh = scanCanvas.height;
      scanCtx.drawImage(video, 0, 0, sw, sh);
      const frame = scanCtx.getImageData(0, 0, sw, sh);
      const data = frame.data;
      const boxes = [];

      if (prevFrameData) {
        // Поиск пятен контраста и движения по сетке
        const step = 8;
        for (let y = 0; y < sh; y += step) {
          for (let x = 0; x < sw; x += step) {
            const idx = (y * sw + x) * 4;
            const diff = Math.abs(data[idx] - prevFrameData[idx]) +
                         Math.abs(data[idx+1] - prevFrameData[idx+1]) +
                         Math.abs(data[idx+2] - prevFrameData[idx+2]);

            // Если обнаружен объект в движении или сильный контраст
            if (diff > 75) {
              boxes.push({
                x: (x / sw) * w,
                y: (y / sh) * h,
                w: (step / sw) * w * 2.2,
                h: (step / sh) * h * 2.2,
                tag: "OBJ_MOTION"
              });
            }
          }
        }
      }

      prevFrameData = data;
      // Ограничиваем количество блоков, чтобы не перегружать экран
      return boxes.slice(0, 6);
    }

    /* -------------------------------------------------------------
       4. ОТРИСОВКА ФИОЛЕТОВЫХ ГЛИТЧ-БЛОКОВ С РАМКАМИ (КАК В ВИДЕО)
       ------------------------------------------------------------- */
    function drawObjectBox(x, y, bw, bh, label = "TARGET") {
      // 1. Пурпурно-фиолетовая заливка
      ctx.fillStyle = 'rgba(168, 15, 200, 0.82)';
      ctx.fillRect(x, y, bw, bh);

      // 2. Яркая белая контурная обводка
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.8;
      ctx.strokeRect(x, y, bw, bh);

      // 3. Внутренний макроблок (эффект сжатия)
      if (bw > 40 && bh > 40) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.strokeRect(x + 4, y + 4, bw - 8, bh - 8);
      }

      // 4. Текстовая метка объекта в стиле Webcore
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px monospace';
      ctx.fillText(`[${label.toUpperCase()}]`, x + 5, y - 6 > 15 ? y - 6 : y + 15);
    }

    /* -------------------------------------------------------------
       5. ОСНОВНОЙ ЦИКЛ РЕНДЕРИНГА (BLUR, COLOR, DATAMOSH)
       ------------------------------------------------------------- */
    function renderLoop() {
      const w = canvas.width;
      const h = canvas.height;

      if (video.readyState >= 2) {
        // --- MOTION BLUR / ШЛЕЙФ ДВИЖЕНИЯ ---
        ctx.globalAlpha = 0.74;
        ctx.drawImage(video, 0, 0, w, h);
        ctx.globalAlpha = 1.0;

        // --- ОКРАШИВАНИЕ В ФИОЛЕТОВЫЙ (COLOR TINT) ---
        ctx.save();
        ctx.globalCompositeOperation = 'color';
        ctx.fillStyle = 'rgba(150, 20, 220, 0.45)';
        ctx.fillRect(0, 0, w, h);
        ctx.restore();

        // 1. ТРЕКИНГ РАСПОЗНАННЫХ AI-ОБЪЕКТОВ (Предметы, техника, окружение)
        let totalTracked = 0;
        if (aiDetections.length > 0) {
          totalTracked += aiDetections.length;
          for (const det of aiDetections) {
            const [bx, by, bw, bh] = det.bbox;
            drawObjectBox(bx, by, bw, bh, det.class);
          }
        }

        // 2. ОПТИЧЕСКИЙ ТРЕКИНГ (Для деревьев, веток, ландшафта на улице)
        const opticalObjects = detectOpticalObjects(w, h);
        totalTracked += opticalObjects.length;
        for (const obj of opticalObjects) {
          drawObjectBox(obj.x, obj.y, obj.w, obj.h, "DATA_BLOCK");
        }

        // Индикатор количества захваченных объектов
        if (hud) {
          hud.innerText = `TRACKING: ${totalTracked} OBJECTS // ACTIVE`;
        }

        // 3. СРЕЗЫ ДАТАМОШИНГА (СДВИГ ПОЛОС)
        if (Math.random() < 0.4) {
          const sliceH = Math.floor(Math.random() * 50) + 15;
          const sliceY = Math.floor(Math.random() * (h - sliceH));
          const offset = (Math.random() - 0.5) * 45;
          ctx.drawImage(canvas, 0, sliceY, w, sliceH, offset, sliceY, w, sliceH);
        }
      }

      requestAnimationFrame(renderLoop);
    }

    window.addEventListener('DOMContentLoaded', initCamera);
  </script>
</body>
</html>
