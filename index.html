<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BREAKCORE // DATAMOSH GLITCH</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Холст на весь экран */
    #glitch_canvas {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      /* Повышенный контраст и насыщенность как в старых пережатых видео */
      filter: contrast(160%) saturate(180%) brightness(90%);
    }

    #video_source {
      display: none;
    }
  </style>

  <!-- MediaPipe Face Mesh CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>

<body>
  <video id="video_source" playsinline></video>
  <canvas id="glitch_canvas"></canvas>

  <script>
    const video = document.getElementById('video_source');
    const canvas = document.getElementById('glitch_canvas');
    const ctx = canvas.getContext('2d');

    let currentLandmarks = null;
    let isProcessing = false;

    // Массив фиолетовых блоков, которые живут своей жизнью (как артефакты в видео)
    const persistentBoxes = [];
    for (let i = 0; i < 18; i++) {
      persistentBoxes.push({
        x: Math.random(),
        y: Math.random(),
        w: Math.random() * 0.25 + 0.05,
        h: Math.random() * 0.35 + 0.08,
        life: Math.floor(Math.random() * 20),
        color: Math.random() > 0.3 ? 'rgba(147, 20, 180, 0.88)' : 'rgba(85, 0, 120, 0.92)'
      });
    }

    /* -------------------------------------------------------------
       1. ПОДКЛЮЧЕНИЕ ОСНОВНОЙ КАМЕРЫ
       ------------------------------------------------------------- */
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }, // Основная задняя камера
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;

        // Запуск параллельного рендеринга
        requestAnimationFrame(renderLoop);
        initMediaPipe();
      } catch (e) {
        console.error("Ошибка камеры:", e);
      }
    }

    /* -------------------------------------------------------------
       2. ИНИЦИАЛИЗАЦИЯ MEDIAPIPE FACE MESH
       ------------------------------------------------------------- */
    function initMediaPipe() {
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 2,
        refineLandmarks: false,
        minDetectionConfidence: 0.4,
        minTrackingConfidence: 0.4
      });

      faceMesh.onResults((results) => {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          currentLandmarks = results.multiFaceLandmarks;
        } else {
          currentLandmarks = null;
        }
      });

      // Передача кадров в FaceMesh
      async function track() {
        if (video.readyState >= 2 && !isProcessing) {
          isProcessing = true;
          await faceMesh.send({ image: video });
          isProcessing = false;
        }
        setTimeout(track, 30); // ~30 FPS для детекции
      }
      track();
    }

    /* -------------------------------------------------------------
       3. ГЕНЕРАТОР ГЛИТЧ-КВАДРАТИКОВ (ИЗ ВИДЕО)
       ------------------------------------------------------------- */
    function drawGlitchBox(x, y, w, h, fill = 'rgba(160, 20, 200, 0.85)') {
      // 1. Фиолетовая плашка артефакта
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, w, h);

      // 2. Тонкая белая рамка
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x, y, w, h);

      // 3. Внутренний дополнительный прямоугольник (эффект макроблока сжатия)
      if (w > 40 && Math.random() < 0.4) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.strokeRect(x + 4, y + 4, w - 8, h - 8);
      }
    }

    /* -------------------------------------------------------------
       4. ОСНОВНОЙ ЦИКЛ РЕНДЕРИНГА (BLUR, COLORING, GLITCH)
       ------------------------------------------------------------- */
    function renderLoop() {
      const w = canvas.width;
      const h = canvas.height;

      if (video.readyState >= 2) {
        // --- ЭФФЕКТ MOTION BLUR / ШЛЕЙФА (GHOSTING) ---
        // Рисуем текущий кадр с лёгкой прозрачностью поверх предыдущего
        ctx.globalAlpha = 0.72; // Чем меньше число, тем сильнее блюр и шлейф
        ctx.drawImage(video, 0, 0, w, h);
        ctx.globalAlpha = 1.0;

        // --- ФИОЛЕТОВОЕ ОКРАШИВАНИЕ (COLOR TINT / THRESHOLD) ---
        // Накладываем глубокий пурпурно-фиолетовый слой в режиме наложения
        ctx.save();
        ctx.globalCompositeOperation = 'color';
        ctx.fillStyle = 'rgba(162, 28, 210, 0.45)';
        ctx.fillRect(0, 0, w, h);
        ctx.restore();

        // Дополнительный контрастный фиолетовый слой на темные зоны
        if (Math.random() < 0.3) {
          ctx.save();
          ctx.globalCompositeOperation = 'exclusion';
          ctx.fillStyle = 'rgba(75, 0, 130, 0.25)';
          ctx.fillRect(0, 0, w, h);
          ctx.restore();
        }

        // --- 1. ТРЕКИНГ КВАДРАТИКОВ НА ЛИЦЕ (ЕСЛИ ОНО В КАДРЕ) ---
        if (currentLandmarks) {
          for (const face of currentLandmarks) {
            // Ключевые точки: глаза (33, 263), рот (13), нос (4), лоб (10), щеки (234, 454)
            const pts = [33, 263, 13, 4, 10, 234, 454, 152];
            pts.forEach((idx) => {
              if (Math.random() < 0.8) {
                const pt = face[idx];
                const bx = pt.x * w - 35 + (Math.random() - 0.5) * 40;
                const by = pt.y * h - 45 + (Math.random() - 0.5) * 40;
                const bw = Math.floor(Math.random() * 90) + 40;
                const bh = Math.floor(Math.random() * 110) + 50;

                drawGlitchBox(bx, by, bw, bh, 'rgba(192, 38, 211, 0.88)');
              }
            });
          }
        }

        // --- 2. АВТОНОМНЫЕ ФИОЛЕТОВЫЕ БЛОКИ (КАК В ВИДЕО ПО ВСЕМУ ЭКРАНУ) ---
        persistentBoxes.forEach((b) => {
          b.life--;
          if (b.life <= 0) {
            b.x = Math.random();
            b.y = Math.random();
            b.w = Math.random() * 0.28 + 0.04;
            b.h = Math.random() * 0.38 + 0.06;
            b.life = Math.floor(Math.random() * 15) + 5;
          }

          if (Math.random() < 0.85) {
            drawGlitchBox(b.x * w, b.y * h, b.w * w, b.h * h, b.color);
          }
        });

        // --- 3. СРЕЗЫ И ДАТАМОШИНГ (СДВИГ ПИКСЕЛЕЙ) ---
        if (Math.random() < 0.5) {
          const sliceH = Math.floor(Math.random() * 60) + 15;
          const sliceY = Math.floor(Math.random() * (h - sliceH));
          const offset = (Math.random() - 0.5) * 60;
          ctx.drawImage(canvas, 0, sliceY, w, sliceH, offset, sliceY, w, sliceH);
        }

        // --- 4. МЕЛКИЙ ЦИФРОВОЙ ШУМ И ПИКСЕЛИ ---
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 12; i++) {
          const sx = Math.random() * w;
          const sy = Math.random() * h;
          ctx.fillRect(sx, sy, Math.random() * 8 + 2, Math.random() * 4 + 2);
        }
      }

      requestAnimationFrame(renderLoop);
    }

    // Старт
    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
