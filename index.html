<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CONFIDENCE BOOSTER // HUD</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #090a0f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Окно терминала как в видео */
    .app-window {
      position: relative;
      width: 95vw;
      max-width: 960px;
      height: 85vh;
      max-height: 560px;
      border: 2px solid #27272a;
      border-radius: 8px;
      background: #000;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Верхняя панель окна */
    .window-header {
      height: 28px;
      background: #18181b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 11px;
      color: #a1a1aa;
      border-bottom: 1px solid #27272a;
    }

    .window-dots {
      display: flex;
      gap: 6px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #eab308; }
    .dot-green { background: #22c55e; }

    /* Холст с видеопотоком */
    #hud_canvas {
      width: 100%;
      height: calc(100% - 28px);
      object-fit: cover;
    }

    /* Всплывающее окно с мемом справа */
    #meme_popup {
      position: absolute;
      right: 20px;
      bottom: 25px;
      width: 260px;
      height: 260px;
      border: 3px solid #22c55e;
      border-radius: 8px;
      background: #000;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.4);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 50;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.6) translateY(40px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    #meme_img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .meme-tag {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.75);
      color: #22c55e;
      font-size: 10px;
      font-weight: bold;
      padding: 3px 6px;
      border: 1px solid #22c55e;
      letter-spacing: 1px;
    }

    #webcam { display: none; }
  </style>

  <!-- Быстрый CDN MediaPipe Face Mesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>

<body>

  <div class="app-window">
    <div class="window-header">
      <div class="window-dots">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
      </div>
      <div>confidence_booster.py — [LIVE]</div>
      <div>v2.4</div>
    </div>

    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="hud_canvas"></canvas>

    <!-- Окно бустера с мемом -->
    <div id="meme_popup">
      <div class="meme-tag">🔥 BOOST ACTIVATED</div>
      <img id="meme_img" src="" alt="Meme" />
    </div>
  </div>

  <script>
    /* =============================================================
       СПИСОК КАРТИНОК / МЕМОВ
       Сюда можно прописать свои картинки из папки на GitHub:
       Например: ['sigma.jpg', 'patrick.png', 'gigachad.gif']
       ============================================================= */
    const MEME_LIST = [
      "https://media.giphy.com/media/CAYVZA5NRb529kKQUc/giphy.gif", // Gigachad
      "https://media.giphy.com/media/kwcRp24WepU5G/giphy.gif",      // Patrick Bateman
      "https://media.giphy.com/media/xoHntNXFYkfzIZ816v/giphy.gif"  // Ryan Gosling
    ];

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('hud_canvas');
    const ctx = canvas.getContext('2d');
    const popup = document.getElementById('meme_popup');
    const memeImg = document.getElementById('meme_img');

    let faceBox = null;
    let isTriggered = false;
    let triggerTimer = null;
    let isDetecting = false;

    /* -------------------------------------------------------------
       1. СТАБИЛЬНАЯ ФРОНТАЛЬНАЯ КАМЕРА
       ------------------------------------------------------------- */
    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user", // Фронтальная камера
            width: { ideal: 960 },
            height: { ideal: 540 }
          },
          audio: false
        });

        video.srcObject = stream;
        await new Promise(r => video.onloadedmetadata = r);
        video.play();

        canvas.width = video.videoWidth || 960;
        canvas.height = video.videoHeight || 540;

        initFaceMesh();
        requestAnimationFrame(renderLoop);
      } catch (err) {
        alert("Камера недоступна или заблокирована: " + err.message);
      }
    }

    /* -------------------------------------------------------------
       2. БЫСТРЫЙ И ЛЕГКИЙ FACE MESH (БЕЗ ЛАГОВ)
       ------------------------------------------------------------- */
    function initFaceMesh() {
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,              // Строго 1 лицо для максимального FPS
        refineLandmarks: false,      // Выключаем тяжелый расчёт зрачков ради плавности
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults(onFaceMeshResults);

      // Цикл отправки кадров (стабильные 30-40 проверок/сек без просадок)
      async function detect() {
        if (video.readyState >= 2 && !isDetecting) {
          isDetecting = true;
          try {
            await faceMesh.send({ image: video });
          } catch(e) {}
          isDetecting = false;
        }
        setTimeout(detect, 25);
      }
      detect();
    }

    /* -------------------------------------------------------------
       3. ДЕТЕКТОР ТРИГГЕРА (ОТКРЫЛ РОТ / ПОДНЕС НАПИТОК)
       ------------------------------------------------------------- */
    function onFaceMeshResults(results) {
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        faceBox = null;
        return;
      }

      const lm = results.multiFaceLandmarks[0];
      const w = canvas.width;
      const h = canvas.height;

      // Вычисляем габариты лица для прицела
      let minX = 1, maxX = 0, minY = 1, maxY = 0;
      for (const p of lm) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }

      // Добавляем отступы
      const padX = (maxX - minX) * 0.15;
      const padY = (maxY - minY) * 0.18;

      faceBox = {
        x: (minX - padX) * w,
        y: (minY - padY) * h,
        w: (maxX - minX + padX * 2) * w,
        h: (maxY - minY + padY * 2) * h
      };

      // Расстояние между губами (13 - верхняя губа, 14 - нижняя)
      const mouthOpen = Math.hypot(
        (lm[13].x - lm[14].x) * w,
        (lm[13].y - lm[14].y) * h
      );

      // Расстояние между глазами для нормировки масштаба
      const eyeDist = Math.hypot(
        (lm[33].x - lm[263].x) * w,
        (lm[33].y - lm[263].y) * h
      );

      // ТРИГГЕР: рот открыт шире обычного (глоток напитка, жест или удивление)
      if (mouthOpen / eyeDist > 0.22) {
        triggerConfidenceBooster();
      }
    }

    /* -------------------------------------------------------------
       4. АКТИВАЦИЯ БУСТЕРА
       ------------------------------------------------------------- */
    function triggerConfidenceBooster() {
      if (isTriggered) return;
      isTriggered = true;

      // Выбираем случайный мем из списка
      const randomMeme = MEME_LIST[Math.floor(Math.random() * MEME_LIST.length)];
      memeImg.src = randomMeme;
      popup.style.display = 'flex';

      // Окно держится 3 секунды, затем возвращается в режим поиска
      clearTimeout(triggerTimer);
      triggerTimer = setTimeout(() => {
        popup.style.display = 'none';
        isTriggered = false;
      }, 3000);
    }

    /* -------------------------------------------------------------
       5. ОТРИСОВКА ТАКТИЧЕСКОГО HUD ИЗ ВИДЕО
       ------------------------------------------------------------- */
    function drawCornerBracket(x, y, w, h, size = 18) {
      ctx.strokeStyle = '#22c55e'; // Яркий зелёный цвет прицела
      ctx.lineWidth = 3;

      // Верх-лево
      ctx.beginPath();
      ctx.moveTo(x, y + size); ctx.lineTo(x, y); ctx.lineTo(x + size, y);
      ctx.stroke();

      // Верх-право
      ctx.beginPath();
      ctx.moveTo(x + w - size, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + size);
      ctx.stroke();

      // Низ-лево
      ctx.beginPath();
      ctx.moveTo(x, y + h - size); ctx.lineTo(x, y + h); ctx.lineTo(x + size, y + h);
      ctx.stroke();

      // Низ-право
      ctx.beginPath();
      ctx.moveTo(x + w - size, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - size);
      ctx.stroke();
    }

    function renderLoop() {
      const w = canvas.width;
      const h = canvas.height;

      if (video.readyState >= 2) {
        ctx.save();

        // 1. Отражаем по горизонтали (Зеркало для фронталки)
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, w, h);
        ctx.restore();

        // 2. Рамка-прицел на лице (с поправкой на зеркальное отражение)
        if (faceBox) {
          const mirroredX = w - faceBox.x - faceBox.w;
          drawCornerBracket(mirroredX, faceBox.y, faceBox.w, faceBox.h);

          // Метка под лицом
          ctx.fillStyle = '#22c55e';
          ctx.font = 'bold 12px monospace';
          ctx.fillText('TARGET_LOCKED', mirroredX + 6, faceBox.y + faceBox.h + 16);
        }

        // 3. Элементы HUD из видео:
        // [REC / LIVE] в левом углу
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(25, 25, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px monospace';
        ctx.fillText('LIVE', 38, 29);

        // Таймкод внизу
        const now = new Date();
        const tc = `00:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}:${String(Math.floor(now.getMilliseconds()/10)).padStart(2, '0')}`;
        ctx.fillStyle = '#22c55e';
        ctx.font = '12px monospace';
        ctx.fillText(`REC: ${tc}`, 20, h - 20);

        // 4. ТАКТИЧЕСКИЙ РАДАР В ПРАВОМ ВЕРХНЕМ УГЛУ
        const radarX = w - 150;
        const radarY = 20;
        const radarW = 130;
        const radarH = 80;

        ctx.strokeStyle = isTriggered ? '#22c55e' : '#52525b';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(radarX, radarY, radarW, radarH);

        // Прицельная сетка в радаре
        ctx.beginPath();
        ctx.moveTo(radarX + radarW/2, radarY + 10);
        ctx.lineTo(radarX + radarW/2, radarY + radarH - 10);
        ctx.moveTo(radarX + 15, radarY + radarH/2);
        ctx.lineTo(radarX + radarW - 15, radarY + radarH/2);
        ctx.stroke();

        // Статус радара
        ctx.fillStyle = isTriggered ? '#22c55e' : '#a1a1aa';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        if (isTriggered) {
          ctx.fillText('MATCHED! 🔥', radarX + radarW/2, radarY + radarH/2 + 4);
        } else {
          ctx.fillText('SEARCHING...', radarX + radarW/2, radarY + radarH/2 + 4);
        }
        ctx.textAlign = 'left';
      }

      requestAnimationFrame(renderLoop);
    }

    window.addEventListener('DOMContentLoaded', startWebcam);
  </script>
</body>
</html>
