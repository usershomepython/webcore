<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RetroLens</title>
<style>
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:#000; color:#0f0; font-family:monospace;
  }
  #stage{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  video{display:none}
  canvas{
    width:100vw; height:100vh; display:block;
    object-fit:cover;
  }
  #hud{
    position:fixed; top:0; left:0; right:0;
    padding:8px 6px; text-align:center; font-size:13px;
    background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,0));
    pointer-events:none; z-index:10;
  }
  #hud b{color:#ff0}
  #fps{
    position:fixed; bottom:6px; right:8px; font-size:11px; color:#0f0;
    opacity:.6; z-index:10;
  }
  #loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000; color:#0f0; font-size:16px; z-index:20;
  }
</style>
</head>
<body>
<div id="loading">Загрузка камеры…</div>
<div id="hud">
  РЕЖИМ: <b id="modeName">PERSEGI 2D</b> [клавиша 'c' / кулаки 2 руками] &nbsp;|&nbsp;
  ФИЛЬТР: <b id="fname">dual-tone</b> [касание большой-мизинец / 'n' / 'p']
</div>
<div id="fps"></div>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>
<video id="video" autoplay playsinline muted></video>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', {alpha:false, desynchronized:true});
const loadingEl = document.getElementById('loading');
const fpsEl = document.getElementById('fps');
const fname = document.getElementById('fname');
const modeName = document.getElementById('modeName');

// ---------- Размер холста под весь экран (с учётом реального разрешения камеры) ----------
let srcW = 640, srcH = 480; // обновится, когда видео отдаст реальный размер
function fitCanvasToScreen(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2); // ограничиваем DPR ради производительности
  const cssW = window.innerWidth, cssH = window.innerHeight;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', fitCanvasToScreen);
fitCanvasToScreen();

// Offscreen-буфер держим в разрешении исходного видео (дешевле, чем в разрешении экрана),
// а на экран растягиваем через drawImage.
const off = document.createElement('canvas');
const octx = off.getContext('2d', {alpha:false, willReadFrequently:true});
// Переиспользуемый маленький канвас для pixelate/blur (не создаём заново каждый кадр)
const small = document.createElement('canvas');
const sctx = small.getContext('2d');

const FILTERS = ['dual-tone','thermal','sketch','pixelate','glitch','invert','red-channel','edge','blur','cartoon','rainbow-wave'];
let fi = 0;
let mode3D = false; // false = PERSEGI 2D, true = 3D Full 5 Jari
let lastFilterSwitch = 0, lastModeSwitch = 0;

document.addEventListener('keydown', e=>{
  if(e.key==='n') nextFilter();
  if(e.key==='p') prevFilter();
  if(e.key==='c') toggleMode();
});
function nextFilter(){ fi=(fi+1)%FILTERS.length; fname.textContent=FILTERS[fi]; }
function prevFilter(){ fi=(fi-1+FILTERS.length)%FILTERS.length; fname.textContent=FILTERS[fi]; }
function toggleMode(){ mode3D=!mode3D; modeName.textContent = mode3D? '3D Full 5 Jari' : 'PERSEGI 2D'; }

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function isFist(lm){
  const tips=[8,12,16,20], pips=[6,10,14,18];
  return tips.every((t,i)=>lm[t].y > lm[pips[i]].y);
}
// Переводим нормализованные координаты landmark в пиксели ЭКРАНА (canvas),
// учитывая, что видео растягивается с object-fit: cover.
function px(lm){
  const {sx, sy, sw, sh} = coverTransform();
  return { x: sx + lm.x*sw, y: sy + lm.y*sh };
}
// Вычисляет смещение/масштаб как при object-fit: cover для видео srcW×srcH в canvas cw×ch
function coverTransform(){
  const cw = canvas.width / (window.devicePixelRatio ? Math.min(window.devicePixelRatio,2) : 1);
  const ch = canvas.height / (window.devicePixelRatio ? Math.min(window.devicePixelRatio,2) : 1);
  const scale = Math.max(cw/srcW, ch/srcH);
  const dw = srcW*scale, dh = srcH*scale;
  const dx = (cw-dw)/2, dy = (ch-dh)/2;
  return {sx:dx, sy:dy, sw:dw, sh:dh};
}

// Применяет фильтр ко всему offscreen-кадру (потом вырезаем через clip)
function renderFiltered(name){
  octx.drawImage(video,0,0,off.width,off.height);
  const img = octx.getImageData(0,0,off.width,off.height);
  const d = img.data;
  const t = performance.now()/300;
  if(name==='invert'){
    for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];}
  } else if(name==='thermal'){
    for(let i=0;i<d.length;i+=4){const g=(d[i]+d[i+1]+d[i+2])/3;d[i]=Math.min(255,g*2);d[i+1]=g;d[i+2]=255-g;}
  } else if(name==='sketch'){
    for(let i=0;i<d.length;i+=4){const g=255-((d[i]+d[i+1]+d[i+2])/3);d[i]=d[i+1]=d[i+2]=g;}
  } else if(name==='red-channel'){
    for(let i=0;i<d.length;i+=4){d[i+1]=0;d[i+2]=0;}
  } else if(name==='dual-tone'){
    for(let i=0;i<d.length;i+=4){const g=(d[i]+d[i+1]+d[i+2])/3; if(g>128){d[i]=255;d[i+1]=180;d[i+2]=0;}else{d[i]=20;d[i+1]=20;d[i+2]=120;}}
  } else if(name==='cartoon'){
    for(let i=0;i<d.length;i+=4){d[i]=Math.round(d[i]/50)*50;d[i+1]=Math.round(d[i+1]/50)*50;d[i+2]=Math.round(d[i+2]/50)*50;}
  } else if(name==='edge'){
    const w=off.width,h=off.height, src=new Uint8ClampedArray(d);
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
      const i=(y*w+x)*4;
      const gx = src[i-4]-src[i+4];
      const gy = src[i-w*4]-src[i+w*4];
      const e = Math.min(255, Math.hypot(gx,gy));
      d[i]=d[i+1]=d[i+2]=e;
    }
  } else if(name==='rainbow-wave'){
    for(let y=0;y<off.height;y++)for(let x=0;x<off.width;x++){
      const i=(y*off.width+x)*4;
      const hue = ((x/off.width)*360 + t*60) % 360;
      const c = hsv2rgb(hue,0.6,1);
      d[i]=(d[i]*0.4+c[0]*0.6); d[i+1]=(d[i+1]*0.4+c[1]*0.6); d[i+2]=(d[i+2]*0.4+c[2]*0.6);
    }
  } else if(name==='glitch'){
    const w=off.width,h=off.height;
    for(let y=0;y<h;y+=4){
      const shift = Math.floor(Math.sin(y*0.1+t)*20);
      const row = octx.getImageData(0,y,w,4);
      octx.putImageData(row, shift, y);
    }
    return; // уже нарисовано напрямую в octx
  }
  octx.putImageData(img,0,0);
  if(name==='pixelate' || name==='blur'){
    const size = name==='pixelate'?14:6;
    const sw = Math.max(1, Math.round(off.width/size));
    const sh = Math.max(1, Math.round(off.height/size));
    if(small.width!==sw) small.width = sw;
    if(small.height!==sh) small.height = sh;
    sctx.drawImage(off,0,0,sw,sh);
    octx.imageSmoothingEnabled = name==='blur';
    octx.clearRect(0,0,off.width,off.height);
    octx.drawImage(small,0,0,off.width,off.height);
  }
}
function hsv2rgb(h,s,v){
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  return [(r+m)*255,(g+m)*255,(b+m)*255];
}

// ---------- FPS-счётчик (лёгкий, обновляется раз в секунду) ----------
let frames=0, lastFpsT=performance.now();
function tickFps(){
  frames++;
  const now = performance.now();
  if(now-lastFpsT>=1000){
    fpsEl.textContent = frames+' fps';
    frames=0; lastFpsT=now;
  }
}

function onResults(res){
  if(loadingEl.style.display!=='none'){ loadingEl.style.display='none'; }

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = canvas.width/dpr, ch = canvas.height/dpr;
  ctx.clearRect(0,0,cw,ch);

  // Рисуем видео на весь экран, имитируя object-fit: cover
  const {sx, sy, sw, sh} = coverTransform();
  ctx.drawImage(res.image, sx, sy, sw, sh);

  const handsData = res.multiHandLandmarks || [];
  const now = performance.now();

  // Жест: обе руки — кулак -> переключить режим
  if(handsData.length===2 && isFist(handsData[0]) && isFist(handsData[1]) && now-lastModeSwitch>900){
    toggleMode(); lastModeSwitch = now;
  }
  // Жест: большой+мизинец касаются -> след. фильтр
  for(const lm of handsData){
    if(dist(lm[4],lm[20])<0.05 && now-lastFilterSwitch>600){
      nextFilter(); lastFilterSwitch = now; break;
    }
  }

  let poly = null;
  if(!mode3D && handsData.length===2){
    // ПРЯМОУГОЛЬНИК: большой+указательный палец каждой руки = 4 угла окна
    const A = handsData[0], B = handsData[1];
    poly = [px(A[4]), px(A[8]), px(B[8]), px(B[4])];
  } else if(mode3D && handsData.length>=1){
    // ВЕЕР 5 ПАЛЬЦЕВ одной руки
    const A = handsData[0];
    poly = [4,8,12,16,20].map(i=>px(A[i]));
  }

  if(poly && poly.length>=3){
    renderFiltered(FILTERS[fi]);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(poly[0].x, poly[0].y);
    for(let i=1;i<poly.length;i++) ctx.lineTo(poly[i].x, poly[i].y);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(off, sx, sy, sw, sh);
    ctx.restore();
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Точки на пальцах (золотые, как в оригинале)
  ctx.fillStyle = '#ffd700';
  for(const lm of handsData) for(const p of lm){
    const c = px(p);
    ctx.beginPath(); ctx.arc(c.x,c.y,3,0,7); ctx.fill();
  }

  tickFps();
}

const handsModel = new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
handsModel.setOptions({
  maxNumHands:2,
  modelComplexity:1,
  minDetectionConfidence:0.6,
  minTrackingConfidence:0.6
});
handsModel.onResults(onResults);

// Запрашиваем камеру напрямую с хорошим разрешением и передней/задней камерой на выбор,
// чтобы получить максимум качества, которое реально может дать устройство.
let processing = false;
async function frameLoop(){
  if(video.readyState >= 2 && !processing){
    processing = true;
    try{ await handsModel.send({image: video}); }
    catch(e){ /* игнорируем единичные сбои кадра */ }
    processing = false;
  }
  requestAnimationFrame(frameLoop);
}

async function startCamera(){
  // Пытаемся с фронтальной камерой и хорошим разрешением; если что-то не даёт —
  // откатываемся на более простые constraints, чтобы не ловить NotReadableError/OverconstrainedError.
  const attempts = [
    {audio:false, video:{facingMode:'user', width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30,max:30}}},
    {audio:false, video:{facingMode:'user'}},
    {audio:false, video:true}
  ];
  let stream = null, lastErr = null;
  for(const constraints of attempts){
    try{
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      break;
    }catch(e){ lastErr = e; }
  }
  if(!stream) throw lastErr || new Error('Камера недоступна');

  video.srcObject = stream;
  await video.play();

  srcW = video.videoWidth || 1280;
  srcH = video.videoHeight || 720;
  off.width = srcW; off.height = srcH;

  // ВАЖНО: не используем Camera() из camera_utils.js — она сама вызывает getUserMedia
  // на этом же <video>, а второй одновременный запрос к камере даёт NotReadableError
  // на iOS/некоторых Android. Кадры в модель гоним вручную через requestAnimationFrame.
  requestAnimationFrame(frameLoop);
}

startCamera().catch(err=>{
  loadingEl.textContent = 'Не удалось получить доступ к камере: '+err.message;
});
</script>
</body>
</html>
