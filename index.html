<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WEBCORE // REAL TRACKING</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #glitch_canvas {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      filter: contrast(130%) saturate(160%);
    }

    /* Информационный оверлей для проверки работы трекинга */
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      color: #ff0055;
      background: rgba(0, 0, 0, 0.75);
      padding: 6px 12px;
      border: 1px solid #d946ef;
      z-index: 100;
      pointer-events: none;
    }

    #video_source {
      display: none;
    }
  </style>

  <!-- CDN MediaPipe Face Mesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>

<body>
  <div id="hud">STATUS: INITIALIZING...</div>
  <video id="video_source" playsinline></video>
  <canvas id="glitch_canvas"></canvas>

  <script>
    const video = document.getElementById('video_source');
    const canvas = document.getElementById('glitch_canvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');

    let detectedFaces = [];
    let isTrackingBusy = false;

    /* -------------------------------------------------------------
       1. СТАБИЛЬНЫЙ ЗАПУСК ОСНОВНОЙ КАМЕРЫ
       ------------------------------------------------------------- */
    async function startCamera() {
      hud.innerText = "STATUS: REQUESTING REAR CAMERA...";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        
        // Ждем обязательной готовности метаданных видео
        await new Promise((resolve) => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });

        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;

        hud.innerText = "STATUS: CAMERA READY, LOADING MODEL...";
        initFaceMesh();
        requestAnimationFrame(renderLoop);
      } catch (err) {
        console.error("Camera Error:", err);
        hud.innerText = `CAMERA ERROR: ${err.message}`;
        hud.style.color = "red";
      }
    }

    /* -------------------------------------------------------------
       2. ИНИЦИАЛИЗАЦИЯ И ОБРАБОТКА MEDIAPIPE FACE MESH
       ------------------------------------------------------------- */
    function initFaceMesh() {
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 2,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults((results) => {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          detectedFaces = results.multiFaceLandmarks;
          hud.innerText = `TRACKING ACTIVE // FACES: ${detectedFaces.length}`;
          hud.style.color = "#00ff66";
        } else {
          detectedFaces = [];
          hud.innerText = "TRACKING ACTIVE // NO FACE IN FRAME";
          hud.style.color = "#d946ef";
        }
      });

      // Безопасный цикл трекинга кадров без утечек и зависаний
      async function sendFrame() {
        if (video.readyState >= 2 && !isTrackingBusy) {
          isTrackingBusy = true;
          try {
            await faceMesh.send({ image: video });
          } catch (e) {
            console.error("Tracking Frame Error:", e);
          } finally {
            isTrackingBusy = false;
          }
        }
        // Запрос детекции 30 раз в секунду
        setTimeout(sendFrame, 33);
      }

      sendFrame();
    }

    /* -------------------------------------------------------------
       3. ФУНКЦИЯ ОТРИСОВКИ ТРЕКИНГ-БЛОКА НА ТОЧКЕ ЛИЦА
       ------------------------------------------------------------- */
    function drawGlitchBlock(x, y, w, h) {
      // 1. Фиолетовая заливка (ядовито-пурпурная, как в видео)
      ctx.fillStyle = 'rgba(168, 15, 200, 0.85)';
      ctx.fillRect(x - w / 2, y - h / 2, w, h);

      // 2. Белая рамка сжатия
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x - w / 2, y - h / 2, w, h);

      // 3. Внутренняя рамка макроблока
      if (w > 30) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.strokeRect(x - w / 2 + 3, y - h / 2 + 3, w - 6, h - 6);
      }
    }

    /* -------------------------------------------------------------
       4. ОСНОВНОЙ ЦИКЛ РЕНДЕРИНГА НА CANVAS
       ------------------------------------------------------------- */
    function renderLoop() {
      const w = canvas.width;
      const h = canvas.height;

      if (video.readyState >= 2) {
        // --- ЭФФЕКТ ШЛЕЙФА / БЛЮРА (MOTION BLUR) ---
        ctx.globalAlpha = 0.75;
        ctx.drawImage(video, 0, 0, w, h);
        ctx.globalAlpha = 1.0;

        // --- ОКРАШИВАНИЕ В ФИОЛЕТОВЫЙ (WEBCORE COLOR TINT) ---
        ctx.save();
        ctx.globalCompositeOperation = 'color';
        ctx.fillStyle = 'rgba(147, 51, 234, 0.5)';
        ctx.fillRect(0, 0, w, h);
        ctx.restore();

        // --- СТРОГИЙ ТРЕКИНГ КВАДРАТОВ ПО ЛИЦУ ---
        // Рисуется ТОЛЬКО тогда, когда нейросеть реально держит лицо
        if (detectedFaces.length > 0) {
          for (const landmarks of detectedFaces) {
            /* Ключевые точки лица:
               33: Левый глаз
               263: Правый глаз
               168: Переносица
               13: Верхняя губа
               14: Нижняя губа
               10: Верхняя граница лба
               152: Подбородок
               234, 454: Левая и правая скулы */
            
            // Расстояние между глазами для масштаба квадратиков
            const eyeDist = Math.hypot(
              (landmarks[263].x - landmarks[33].x) * w,
              (landmarks[263].y - landmarks[33].y) * h
            );

            // 1. Блок на левом глазу
            const leftEye = landmarks[33];
            drawGlitchBlock(leftEye.x * w, leftEye.y * h, eyeDist * 0.7, eyeDist * 0.5);

            // 2. Блок на правом глазу
            const rightEye = landmarks[263];
            drawGlitchBlock(rightEye.x * w, rightEye.y * h, eyeDist * 0.7, eyeDist * 0.5);

            // 3. Блок на рту
            const mouth = landmarks[13];
            drawGlitchBlock(mouth.x * w, mouth.y * h, eyeDist * 0.9, eyeDist * 0.45);

            // 4. Большой блок на лобной зоне
            const forehead = landmarks[10];
            drawGlitchBlock(forehead.x * w, forehead.y * h, eyeDist * 1.2, eyeDist * 0.6);

            // 5. Контурная фиолетовая сетка подбородка и скул
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            const oval = [234, 152, 454];
            oval.forEach((id, i) => {
              const pt = landmarks[id];
              if (i === 0) ctx.moveTo(pt.x * w, pt.y * h);
              else ctx.lineTo(pt.x * w, pt.y * h);
            });
            ctx.stroke();

            // 6. Datamosh-срез, следующий за уровнем глаз
            if (Math.random() < 0.6) {
              const sliceY = Math.floor(leftEye.y * h - 20);
              const sliceH = Math.floor(eyeDist * 0.4);
              const shift = (Math.random() - 0.5) * 50;
              ctx.drawImage(canvas, 0, sliceY, w, sliceH, shift, sliceY, w, sliceH);
            }
          }
        }
      }

      requestAnimationFrame(renderLoop);
    }

    // Запуск при загрузке страницы
    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
