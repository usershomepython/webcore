<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>RetroLens</title>
<style>
  body{margin:0;background:#111;color:#0f0;font-family:monospace;display:flex;flex-direction:column;align-items:center}
  #wrap{position:relative}
  video{display:none}
  canvas{max-width:100%;border:2px solid #0f0}
  #hud{padding:6px;text-align:center}
  #hud b{color:#ff0}
</style>
</head>
<body>
<div id="hud">Фильтр: <b id="fname">normal</b> | Большой палец касается кончика пальца → фильтр</div>
<div id="wrap">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" width="640" height="480"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fname = document.getElementById('fname');

const filters = ['normal','invert','thermal','sketch','pixelate','red-channel','cartoon'];
let fi = 0;
let lastSwitch = 0;

// Кончики пальцев: 4=большой,8=указательный,12=средний,16=безымянный,20=мизинец
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

// Возвращает индекс пальца (8/12/16/20), которого коснулся большой палец, либо null
function touchedFinger(lm){
  const thumb = lm[4];
  const tips = [8,12,16,20];
  for(const t of tips){
    if(dist(thumb, lm[t]) < 0.05) return t; // порог касания
  }
  return null;
}

function applyFilter(name){
  const img = ctx.getImageData(0,0,canvas.width,canvas.height);
  const d = img.data;
  if(name==='invert'){
    for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2];}
  } else if(name==='thermal'){
    for(let i=0;i<d.length;i+=4){
      const g=(d[i]+d[i+1]+d[i+2])/3;
      d[i]=Math.min(255,g*2); d[i+1]=g; d[i+2]=255-g;
    }
  } else if(name==='sketch'){
    for(let i=0;i<d.length;i+=4){
      const g=255-((d[i]+d[i+1]+d[i+2])/3);
      d[i]=d[i+1]=d[i+2]=g;
    }
  } else if(name==='red-channel'){
    for(let i=0;i<d.length;i+=4){d[i+1]=0;d[i+2]=0;}
  } else if(name==='cartoon'){
    for(let i=0;i<d.length;i+=4){
      d[i]=Math.round(d[i]/60)*60;
      d[i+1]=Math.round(d[i+1]/60)*60;
      d[i+2]=Math.round(d[i+2]/60)*60;
    }
  }
  if(name!=='pixelate') ctx.putImageData(img,0,0);
  if(name==='pixelate'){
    const size=16;
    for(let y=0;y<canvas.height;y+=size){
      for(let x=0;x<canvas.width;x+=size){
        const p = ctx.getImageData(x,y,1,1).data;
        ctx.fillStyle=`rgb(${p[0]},${p[1]},${p[2]})`;
        ctx.fillRect(x,y,size,size);
      }
    }
  }
}

const hands = new Hands({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.6,minTrackingConfidence:0.6});
hands.onResults(onResults);

function onResults(res){
  ctx.save();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(res.image,0,0,canvas.width,canvas.height);

  if(res.multiHandLandmarks && res.multiHandLandmarks.length){
    const lm = res.multiHandLandmarks[0];
    const now = Date.now();
    const t = touchedFinger(lm);
    if(t && now-lastSwitch>600){
      // указательный->invert, средний->thermal, безымянный->sketch, мизинец->pixelate
      const map = {8:1, 12:2, 16:3, 20:4};
      fi = map[t] ?? fi;
      lastSwitch = now;
    }
  }
  applyFilter(filters[fi]);
  fname.textContent = filters[fi];
  ctx.restore();
}

const camera = new Camera(video, {
  onFrame: async ()=>{ await hands.send({image: video}); },
  width:640, height:480
});
camera.start();
</script>
</body>
</html>
